<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LB Conexão - Ecossistema Completo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .header {
            padding: 50px;
            background: #fff;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 40px;
            flex-wrap: wrap;
        }

        .card {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 250px;
            transition: 0.3s;
            text-decoration: none;
            color: #333;
        }

        .card:hover {
            transform: translateY(-10px);
        }

        .card img {
            width: 100%;
            border-radius: 5px;
        }

        h2 {
            color: #003366;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>LB Conexão</h1>
        <p>Seu ecossistema completo de Tecnologia, Saúde e Ofertas.</p>
    </div>

    <div class="container">
        <a href="saude /" class="card">
            <img src="logo-saude.jpg" alt="LB Conexão Saúde">
            <h3>Saúde</h3>
            <p>Educação e Consultoria</p>
        </a>

        <a href="dev /" class="card">
            <img src="logo-dev.jpg" alt="LB Conexão Dev">
            <h3>Tecnologia</h3>
            <p>Sistemas e Aplicativos</p>
        </a>

        <a href="store /" class="card">
            <img src="logo-store.jpg" alt="LB Conexão Store">
            <h3>Store</h3>
            <p>Infoprodutos e Ofertas</p>
        </a>
    </div>

    <footer>
        <p>&copy; 2026 LB CONEXÃO EMPREENDIMENTOS E SERVIÇOS LTDA.</p>
    </footer>
</body>


</html>
